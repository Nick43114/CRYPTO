<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PumpDetector Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ?v=4 оновлює кеш Telegram -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- Модальне вікно вибору мови -->
  <div class="lang-modal-overlay hidden" id="langModal">
    <div class="lang-modal">
      <div class="lang-icon">🌐</div>
      <h2 class="lang-title">Оберіть мову / Choose Language</h2>
      <p class="lang-subtitle">На якій мові ви бажаєте продовжити?</p>
      <div class="lang-options">
        <button class="btn-lang-choice" onclick="selectLanguage('uk')">
          <span class="flag">🇺🇦</span>
          <span class="lang-text"><strong>Українська</strong><small>Ukrainian</small></span>
        </button>
        <button class="btn-lang-choice" onclick="selectLanguage('en')">
          <span class="flag">🇬🇧</span>
          <span class="lang-text"><strong>English</strong><small>Англійська</small></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Модальне вікно детального графіка -->
  <div class="chart-modal-overlay hidden" id="chartModal">
    <div class="chart-modal">
      <div class="chart-modal-header">
        <div class="modal-coin-info">
          <span id="modalCoinName" class="modal-coin-title">BTC/USDT</span>
          <span id="modalCoinPrice" class="modal-coin-price">$0.00</span>
        </div>
        <button class="btn-close-modal" id="closeChartBtn">✕</button>
      </div>

      <!-- Періоди графіка -->
      <div class="tf-selector">
        <button class="tf-btn active" data-tf="1d">1 дн</button>
        <button class="tf-btn" data-tf="7d">7 дн</button>
        <button class="tf-btn" data-tf="1m">1 міс</button>
        <button class="tf-btn" data-tf="1y">1 р</button>
        <button class="tf-btn" data-tf="2y">2 р</button>
        <button class="tf-btn" data-tf="5y">5 р</button>
      </div>

      <!-- Інтерактивне полотно з точкою -->
      <div class="big-chart-wrapper">
        <canvas id="bigChartCanvas"></canvas>
      </div>

      <div class="chart-labels-row" id="timeLabelsRow">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>Зараз</span>
      </div>
    </div>
  </div>

  <!-- Шапка -->
  <header class="header">
    <div class="header-info">
      <div class="brand">
        <span class="brand-logo">⚡</span>
        <h1 class="brand-title">Pump<span class="highlight">Detector</span></h1>
      </div>
      <div class="updated-status">
        <span class="live-dot"></span>
        <span id="updated">Синхронізація...</span>
      </div>
    </div>
    
    <div class="header-actions">
      <button class="btn-action" id="langSwitchBtn"><span id="currentLangLabel">UA</span></button>
      <button class="btn-action" id="refreshBtn" title="Оновити">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Сітка карток -->
  <main class="grid" id="grid">
    <div class="loading-state">
      <div class="spinner"></div>
      <p id="loadingText">Завантаження графіків та цін Binance...</p>
    </div>
  </main>

  <!-- Скрипт з вібро-відгуком -->
  <script src="script.js?v=4"></script>
</body>
</html>
