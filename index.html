<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PumpDetector</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Верхняя панель (Header) -->
  <header class="header">
    <div class="header-info">
      <div class="brand">
        <span class="brand-logo">⚡</span>
        <h1 class="brand-title">Pump<span style="color: var(--binance-yellow);">Detector</span></h1>
      </div>
      <div class="updated-status">
        <span class="live-dot"></span>
        <span id="updated">Синхронизация...</span>
      </div>
    </div>
    
    <button class="btn-refresh" id="refreshBtn" title="Обновить котировки">
      <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
      </svg>
    </button>
  </header>

  <!-- Сетка котировок -->
  <main class="grid" id="grid">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Анализ котировок рынка...</p>
    </div>
  </main>

  <!-- Скрипт логики -->
  <script src="script.js"></script>
</body>
</html>
